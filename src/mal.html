<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anders Skjerdingstad – Siste dag</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.mono{font-family:"Courier New",monospace}
/* scanlines + vignett */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),
 radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid #fff3;font-size:clamp(11px,1.4vw,16px);letter-spacing:.25em;text-transform:uppercase;color:#ffffffbb}
header b{color:#ff2a2a}
.rec{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:#f22;margin-right:.6em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
main{flex:1;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px;padding:6px;min-height:0}
.pane{position:relative;border:1px solid #fff8;overflow:hidden;background:#050505;min-height:0}
.pane img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pane .tag{position:absolute;left:8px;top:8px;font-size:clamp(10px,1.1vw,13px);letter-spacing:.18em;background:#000a;padding:3px 7px;border:1px solid #fff6;z-index:3}
.pane .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-size:clamp(10px,1.1vw,13px);letter-spacing:.14em;background:linear-gradient(transparent,#000d);z-index:3}
#kontor img{filter:grayscale(.6) sepia(.5) hue-rotate(50deg) saturate(1.8) contrast(1.15) brightness(.85)}
#vin img{transition:filter 1s linear}
.cross{position:absolute;inset:0;z-index:2;pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:#3f3a}
.cross::before{left:50%;top:0;bottom:0;width:1px}
.cross::after{top:50%;left:0;right:0;height:1px}
.box{position:absolute;border:2px solid #ff3030;z-index:3;box-shadow:0 0 12px #f003}
.box span{position:absolute;left:-2px;top:-1.6em;background:#ff3030;color:#000;font-size:clamp(9px,.95vw,12px);padding:1px 5px;letter-spacing:.1em;white-space:nowrap;font-weight:bold}
#kb1{left:36%;top:6%;width:30%;height:22%}
#kb2{left:20%;top:73%;width:27%;height:19%}
#kb3{left:38%;top:80%;width:33%;height:17%}
#vb{left:58%;top:27%;width:20%;height:42%}
/* midtre */
#mid{position:relative;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #fff8;background:radial-gradient(circle at 50% 45%,#1a0000 0%,#000 70%);padding:10px;text-align:center;min-height:0}
#kicker{letter-spacing:.35em;font-size:clamp(11px,1.5vw,18px);color:#ffffffcc;text-transform:uppercase}
#name{font-size:clamp(18px,2.6vw,38px);font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin:.4em 0 .2em}
#sub{font-size:clamp(10px,1.2vw,15px);letter-spacing:.3em;color:#ff4040;margin-bottom:1.2vh}
#clock{font-family:"Courier New",monospace;font-weight:900;font-size:clamp(46px,9.2vw,150px);line-height:1;color:#ff1e1e;text-shadow:0 0 14px #f00,0 0 40px #a00;letter-spacing:.02em;white-space:nowrap}
#clock .c{animation:blink 1s steps(1) infinite}
#clock.hvit{color:#fff;text-shadow:0 0 14px #fff8,0 0 40px #f00}
#label{margin-top:1vh;font-size:clamp(10px,1.2vw,15px);letter-spacing:.4em;color:#ffffffaa}
#bar{width:80%;height:6px;background:#fff2;margin-top:2vh;border:1px solid #fff4}
#bar i{display:block;height:100%;width:0;background:#ff1e1e;box-shadow:0 0 8px #f00}
#stat{margin-top:1.6vh;font-size:clamp(10px,1.1vw,14px);letter-spacing:.15em;color:#3f3;min-height:1.4em}
footer{padding:6px 18px;border-top:1px solid #fff3;font-size:clamp(10px,1.1vw,14px);letter-spacing:.15em;color:#ffffffaa;white-space:nowrap;overflow:hidden}
/* siste minutt */
body.siste #mid{animation:alarm 1s steps(1) infinite}
@keyframes alarm{50%{background:radial-gradient(circle at 50% 45%,#400 0%,#000 70%)}}
body.siste #clock{font-size:clamp(60px,14vw,230px)}
/* hjerter */
#hearts{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
#hearts svg{position:absolute;transform-origin:center;filter:drop-shadow(0 0 8px #f00);animation:lub var(--d,1.1s) infinite;animation-delay:var(--dl,0s);opacity:.9}
#hearts svg.ny{animation:pop .5s ease-out,lub var(--d,1.1s) .5s infinite}
@keyframes lub{0%{transform:scale(.8)}12%{transform:scale(1.05)}24%{transform:scale(.88)}38%{transform:scale(1.12)}60%,100%{transform:scale(.8)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(.8)}}
body.slutt #hearts{display:none}
/* finale */
#flash{position:fixed;inset:0;background:#fff;z-index:100;opacity:0;pointer-events:none}
#flash.go{animation:flash 1.2s ease-out forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#finale{position:fixed;inset:0;z-index:90;background:#000;display:none;align-items:center;justify-content:center;overflow:hidden}
body.slutt #finale{display:flex}
#finale .bg{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;opacity:.18;filter:blur(2px)}
#finale .bg img{width:100%;height:100%;object-fit:cover}
#heart{position:relative;width:min(96vw,150vh);height:min(96vw,150vh);animation:beat 1.1s infinite;filter:drop-shadow(0 0 60px #f00)}
#heart svg{width:100%;height:100%;display:block}
@keyframes beat{0%{transform:scale(.82)}12%{transform:scale(1.04)}24%{transform:scale(.88)}38%{transform:scale(1.08)}60%,100%{transform:scale(.82)}}
#takk{position:absolute;left:0;right:0;bottom:5vh;text-align:center;z-index:3;font-size:clamp(18px,4vw,56px);font-weight:900;letter-spacing:.25em;text-transform:uppercase;text-shadow:0 0 20px #000,0 0 6px #000}
#takk small{display:block;font-size:.4em;letter-spacing:.4em;margin-top:.6em;color:#ffffffcc}
@media (max-width:800px){
 main{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}
 #mid{grid-column:1/3;grid-row:1}
 #clock{font-size:clamp(40px,16vw,100px)}
 body.siste #clock{font-size:clamp(50px,20vw,140px)}
 #kontor,#vin{grid-row:2}
}
</style>
</head>
<body>
<header class="mono"><span><span class="rec"></span>LIVE &nbsp;|&nbsp; NRK NYHETER</span><span id="tk">--:--:--</span><span>DAG <b>1</b> &nbsp;|&nbsp; 06:00 – 13:00</span></header>
<main>
 <section class="pane" id="kontor">
  <img src="data:image/jpeg;base64,@@KONTOR@@" alt="">
  <div class="cross"></div>
  <div class="box" id="kb1"><span>OBJEKT</span></div>
  <div class="box" id="kb2"><span>BEVIS A</span></div>
  <div class="box" id="kb3"><span>BEVIS B</span></div>
  <div class="tag mono">KAM 03 · NEWSROOM</div>
  <div class="cap mono">OBJEKT BEVEGER SEG MOT UTGANGEN</div>
 </section>
 <section id="mid">
  <div id="kicker" class="mono">Siste dag på jobb</div>
  <div id="name">Anders Skjerdingstad</div>
  <div id="sub" class="mono">FRIGJØRING OM</div>
  <div id="clock">00<span class="c">:</span>00<span class="c">:</span>00</div>
  <div id="label" class="mono">TIMER &nbsp;&nbsp; MINUTTER &nbsp;&nbsp; SEKUNDER</div>
  <div id="bar"><i id="barfill"></i></div>
  <div id="stat" class="mono"></div>
 </section>
 <section class="pane" id="vin">
  <img id="vinimg" src="data:image/jpeg;base64,@@VIN@@" alt="">
  <div class="cross"></div>
  <div class="tag mono">KLASSIFISERT · DESTINASJON</div>
  <div class="cap mono" id="vincap">DEKRYPTERER <span id="pct">0</span>%</div>
 </section>
</main>
<footer class="mono" id="foot"></footer>

<div id="hearts"></div>
<div id="flash"></div>
<div id="finale">
 <div class="bg"><img src="data:image/jpeg;base64,@@KONTOR@@" alt=""><img src="data:image/jpeg;base64,@@VIN@@" alt=""></div>
 <div id="heart"><svg viewBox="0 0 100 90"><path fill="#ff0a1e" d="M50 88C20 62 2 44 2 25 2 11 12 2 25 2c10 0 19 6 25 15C56 8 65 2 75 2c13 0 23 9 23 23 0 19-18 37-48 63z"/></svg></div>
</div>

<script>
const TEST=/[?&]test=1/.test(location.search);
const START=new Date();START.setHours(6,0,0,0);
const END=new Date();END.setHours(13,0,0,0);
let target=END.getTime();
if(TEST)target=Date.now()+25000;
const t0=TEST?Date.now()-1000:START.getTime();
const $=id=>document.getElementById(id);
const p=n=>String(n).padStart(2,'0');
const msgs=[
 "STATUS: OBJEKT HAR FORTSATT TILGANG TIL KAFFEMASKINEN",
 "ADVARSEL: INNBOKS ER IKKE LENGER OBJEKTETS PROBLEM",
 "MELDING MOTTATT: IKEA-POSE KLAR VED UTGANG",
 "BEKREFTET: FLASKE ILUN LOKALISERT",
 "OBJEKT SJEKKER MOBIL FOR SISTE GANG SOM ANSATT",
 "KONTORSTOL STÅR ALENE OM KORT TID",
 "TID TIL FRIGJØRING NEDTELLES. INGEN KAN STOPPE DET NÅ"
];
let mi=0;
function msgTick(){ $('foot').textContent="► "+msgs[mi++%msgs.length]; }
msgTick(); setInterval(msgTick,4000);

const hearts=$('hearts');let nh=0;
const HP='<path fill="#ff0a1e" d="M50 88C20 62 2 44 2 25 2 11 12 2 25 2c10 0 19 6 25 15C56 8 65 2 75 2c13 0 23 9 23 23 0 19-18 37-48 63z"/>';
function addHeart(){
 const r=$('mid').getBoundingClientRect(),W=innerWidth,H=innerHeight;
 const sz=18+Math.random()*52,m=sz/2+14;
 for(let i=0;i<40;i++){
  const x=Math.random()*W,y=Math.random()*H;
  if(x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m)continue;
  const e=document.createElementNS('http://www.w3.org/2000/svg','svg');
  e.setAttribute('viewBox','0 0 100 90');e.innerHTML=HP;e.classList.add('ny');
  e.style.cssText='left:'+(x-sz/2)+'px;top:'+(y-sz/2)+'px;width:'+sz+'px;height:'+sz*.9+'px;--d:'+(.8+Math.random()*.7)+'s;--dl:'+(Math.random()*-1)+'s';
  hearts.appendChild(e);nh++;return;
 }
 nh++;
}
function syncHearts(frac){
 const want=Math.round(Math.pow(frac,2)*90);
 while(nh<want)addHeart();
}
let slutt=false;
function tick(){
 const now=Date.now();
 let ms=Math.max(0,target-now);
 const s=Math.ceil(ms/1000);
 const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
 $('clock').innerHTML=p(h)+'<span class="c">:</span>'+p(m)+'<span class="c">:</span>'+p(sec);
 const d=new Date();
 $('tk').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
 const frac=Math.min(1,Math.max(0,(now-t0)/(target-t0)));
 $('barfill').style.width=(frac*100)+'%';
 const pct=Math.round(frac*100);
 $('pct').textContent=pct;
 const img=$('vinimg');
 img.style.filter='grayscale('+(1-frac)+') blur('+((1-frac)*10)+'px) brightness('+(.5+.5*frac)+')';
 syncHearts(frac);
 $('stat').textContent=pct+'% AV ARBEIDSDAGEN GJENNOMFØRT';
 document.body.classList.toggle('siste',s<=60&&s>0);
 $('clock').classList.toggle('hvit',s<=10&&s>0&&sec%2===0);
 if(ms<=0&&!slutt){slutt=true;finale();}
}
function finale(){
 $('flash').classList.add('go');
 setTimeout(()=>document.body.classList.add('slutt'),150);
}
tick();setInterval(tick,100);
</script>
</body>
</html>
